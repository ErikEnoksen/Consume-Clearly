name: Test and Build

on: [workflow_dispatch]

permissions: write-all

env:
  MSYS2_ARG_CONV_EXCL: "*"
  MSYS_NO_PATHCONV: 1

jobs:
  testAllModes:
    name: Test in ${{ matrix.testMode }}
    runs-on: self-hosted
    timeout-minutes: 45
    env:
      ACTIONS_CACHE_USE_AZURE_CLI: false
      ACTIONS_CACHE_UPLOAD_CHUNK_SIZE: 32000000
    strategy:
      fail-fast: false
      matrix:
        projectPath:
          - .
        testMode:
          - editmode
          - playmode
        unityVersion:
          - 6000.2.6f2
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true

      - name: Debug directory structure
        shell: powershell
        run: |
          echo "Workflow Directory:"
          pwd
          echo "Root Directory:"
          Get-ChildItem -Force
          echo "ProjectSettings:"
          Get-ChildItem -Force ${{ matrix.projectPath }}/ProjectSettings

      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/Library
          key: Library-${{ matrix.projectPath }}-${{ matrix.unityVersion }}
          restore-keys: |
            Library-${{ matrix.projectPath }}-
            Library-

      - name: Run Tests
        shell: powershell
        env:
          UNITY_PATH: ${{ secrets.UNITY_PATH }}
        run: |
          $resultsPath = ".\${{ matrix.testMode }}-artifacts\results.xml"
          New-Item -ItemType Directory -Force -Path ".\${{ matrix.testMode }}-artifacts"
          & "$env:UNITY_PATH" `
            -runTests `
            -testPlatform ${{ matrix.testMode }} `
            -projectPath . `
            -testResults $resultsPath `
            -batchmode `
            -nographics
          Write-Host "Test results path: $(Resolve-Path .\editmode-artifacts -ErrorAction SilentlyContinue)"
          exit $LASTEXITCODE

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Test results for ${{ matrix.testMode }}
          path: ${{ github.workspace }}\${{ matrix.testMode }}-artifacts

  buildForAllSupportedPlatforms:
    name: Build for ${{ matrix.targetPlatform }}
    needs: testAllModes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        targetPlatform:
          - StandaloneOSX
          - StandaloneWindows
          - StandaloneWindows64
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
          fetch-depth: 0

      - uses: actions/cache@v5
        with:
          path: Library
          key: Library-${{ matrix.targetPlatform }}
          restore-keys: Library-

      - name: Build the Project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: ${{ matrix.targetPlatform }}

      - uses: actions/upload-artifact@v6
        with:
          name: Build-${{ matrix.targetPlatform }}
          path: build/${{ matrix.targetPlatform }}