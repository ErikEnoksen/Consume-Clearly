name: Test

on: [push, pull_request, workflow_dispatch]

permissions: write-all

jobs:
  testAllModes:
    name: Test in ${{ matrix.testMode }}
    runs-on: self-hosted
    timeout-minutes: 45
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      TAR_OPTIONS: --force-local
    strategy:
      fail-fast: false
      matrix:
        projectPath:
          - .
        testMode:
          - editmode
        unityVersion:
          - 6000.2.6f2
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Debug directory structure
        shell: powershell
        run: |
          echo "Workflow Directory:"
          pwd
          echo "Root Directory:"
          Get-ChildItem -Force
          echo "ProjectSettings:"
          Get-ChildItem -Force ${{ matrix.projectPath }}/ProjectSettings

      - uses: actions/cache@v4
        with:
          path: ${{ matrix.projectPath }}/Library
          key: Library-${{ matrix.projectPath }}-${{ matrix.unityVersion }}
          restore-keys: |
            Library-${{ matrix.projectPath }}-
            Library-

      - name: Run EditMode Tests
        shell: powershell
        env:
          UNITY_PATH: ${{ secrets.UNITY_PATH }}
        run: |
          $resultsPath = ".\editmode-artifacts\results.xml"
          New-Item -ItemType Directory -Force -Path ".\editmode-artifacts"
          & "$env:UNITY_PATH" `
            -runTests `
            -testPlatform ${{ matrix.testMode }} `
            -projectPath . `
            -testResults $resultsPath `
            -batchmode `
            -nographics
          exit $LASTEXITCODE

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Test results for ${{ matrix.testMode }}
          path: .\${{ matrix.testMode }}-artifacts